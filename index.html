<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%231d1b16'/><path d='M9 23c6 0 2-14 8-14s2 14 8 14' fill='none' stroke='%23f6c453' stroke-width='3' stroke-linecap='round'/></svg>"
    />
    <title>Codepfad</title>
    <script>
      // Farbschema vor dem ersten Zeichnen setzen, damit nichts aufblitzt.
      try {
        const t = JSON.parse(localStorage.getItem('cp:theme') ?? '"system"');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
        document.documentElement.dataset.lang = JSON.parse(localStorage.getItem('cp:lang') ?? '"python"');
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
